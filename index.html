<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painopisteen Ennustin</title>

<link rel="stylesheet" href="style.css">

<script>
const API_BASE = "https://script.google.com/macros/s/AKfycbx3aclgfS6WkEaoi-pwT_5TJB1G9A42d_L6Rkfj_wWYWW-bme3l5JucygCVAXTw8JLi/exec";
</script>

<script src="app.js" defer></script>
</head>

<body>

<!-- ================= ALOITUS ================= -->
<div id="startView" class="start-view">

  <div class="start-card">
    
    <button id="logoutBtn"
          class="logout-btn"
          type="button"
          onclick="Auth.logout()"
           title="Kirjaudu ulos">
      X
    </button>
    
    <img src="Iconi_500x300-removebg-preview.png" 
         class="start-logo" 
         alt="Logo">

    <div class="start-title">
      Painopisteen Ennustin
      <span class="start-version">v<span id="appVersion"></span></span>
    </div>

   <div class="start-actions">
      <button id="lisaaLennokkiBtn"
              title="Lisää uusi lennokki">+</button>
    
      <button onclick="avaaLennokki()"
              title="Avaa valittu lennokki">›</button>
    
      <button onclick="kopioiValittuLennokki()"
              title="Kopioi valittu lennokki">⧉</button>
    
      <button onclick="muokkaaValittuaLennokkia()"
              title="Muokkaa valittua lennokkia">✏️</button>
    
      <button onclick="poistaValittuLennokki()"
              title="Poista valittu lennokki">−</button>
    
      <button onclick="avaaOhje()"
              title="Ohje">?</button>
    </div>


    <div class="start-table-wrapper">
      <table class="start-table">
        <thead>
          <tr>
            <th>Lennokki</th>
            <th>Paino</th>
            <th>Pp</th>
            <th>Pvm</th>
          </tr>
        </thead>
        <tbody id="startTableBody"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- ================= SOVELLUS ================= -->
<div id="appView" style="display:none;">
  <div class="app">

    <header class="topbar">

    <div class="left">
      <div class="titlebar">
        <strong class="title">
          Painopisteen Ennustin v<span id="appVersion2"></span>
        </strong>
      </div>
  
      <div class="nav">
        <button class="back-btn" onclick="palaaAloitukseen()"
          title="Takaisin aloitukseen">‹</button>
        <button class="active" onclick="naytaOsat()"
          title="Osat">#</button>
        <button id="suodatusBtn" onclick="vaihdaSuodatus()"
          title="Näytä vain täytetyt / Näytä kaikki">Ø</button>      
        <button id="tallennaBtn" onclick="tallenna()"
          title="Tallenna">√</button>
        <button onclick="naytaYhteenveto()"
          title="Yhteenveto">Ʃ</button>
        <button class="help-btn" onclick="avaaOhje()"
          title="Ohje">?</button>
      </div>
    </div>
  
    <div class="right">
      <select id="lennokkiSelect"
              onchange="vaihdaLennokki(this.value)">
      </select>
    </div>
  </header>
  <div id="osatView"></div>
  <div class="editor-footer">
    <button id="tallennaBtn" class="toolbar-btn">Tallenna</button>
  </div>
  <div id="yhteenvetoView" style="display:none;">
    <div id="yhteenvetoTable"></div>
  </div>
  </div>
</div>
<div id="ohjeModal" class="modal">
  <div class="modal-content">
    <span onclick="suljeOhje()" class="close">&times;</span>
    <div id="ohjeTeksti"></div>
  </div>
</div>  
<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
        <canvas id="loadingCanvas"
                width="700"
                height="350">
        </canvas>
        <div class="loading-text">
            Päivitetään lennokin painopistelaskentaa...
        </div>
    </div>
</div>
</body>
</html>
